name: Build PulsePlayer APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Accept licenses and install required packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Offline manifest and source assertions
        run: python3 scripts/verify_source.py
      - name: Compile and run tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK archive and manifest metadata
        run: |
          set -euo pipefail
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 15
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" | tee /tmp/standard-apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/standard-apk-signature.txt
          grep -m1 "Signer #1 certificate SHA-256 digest:" /tmp/standard-apk-signature.txt > app/build/outputs/apk/debug/SIGNER_SHA256.txt
          test -s app/build/outputs/apk/debug/SIGNER_SHA256.txt
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseplayer-v4-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/SIGNER_SHA256.txt
          if-no-files-found: error
          retention-days: 14