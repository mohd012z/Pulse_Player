name: Build PulsePlayer APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract verified v6 source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "ce1ea0bfe20ac58e3b1afc59b84c886548a61bcf89295fe2d6a992e45bad94d3  PulsePlayer-v6-MP3-Downloads-Quality-Source.zip" | sha256sum --check -
          unzip -t PulsePlayer-v6-MP3-Downloads-Quality-Source.zip
          mkdir -p "$RUNNER_TEMP/pulse-source"
          unzip -q PulsePlayer-v6-MP3-Downloads-Quality-Source.zip -d "$RUNNER_TEMP/pulse-source"
          test -f "$RUNNER_TEMP/pulse-source/PulsePlayer-v6/settings.gradle.kts"
          cp -a "$RUNNER_TEMP/pulse-source/PulsePlayer-v6/." "$GITHUB_WORKSPACE/"
          test -f app/src/main/java/com/pulseplayer/app/AuthorizedMp3Downloader.kt
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Accept licenses and install required packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Offline manifest and source assertions
        run: python3 scripts/verify_source.py
      - name: Compile and run tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK archive and manifest metadata
        run: |
          set -euo pipefail
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 15
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulseplayer-v6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14