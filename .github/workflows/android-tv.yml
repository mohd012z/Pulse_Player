name: Android TV verification
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Source assertions
        run: python3 scripts/verify_source.py
      - name: Compile and test
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify TV manifest and APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/tv-badging.txt
          grep -q 'android.software.leanback' /tmp/tv-badging.txt
          grep -q 'android.hardware.touchscreen' /tmp/tv-badging.txt
          grep -q 'leanback-launchable-activity:' /tmp/tv-badging.txt
          sha256sum "$APK"
      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
