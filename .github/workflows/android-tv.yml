name: Android TV verification
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:
jobs:
  verify-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build TV debug APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify TV launcher in merged manifest
        run: |
          grep -R -q 'android.intent.category.LEANBACK_LAUNCHER' app/build/intermediates/merged_manifests/debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-player-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
