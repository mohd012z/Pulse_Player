name: Build Android TV Pie APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-tv-pie.yml'
  push:
    branches:
      - feature/android-tv-pie-apk

jobs:
  android-tv-pie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner already includes the Android SDK; Gradle resolves required packages.
      - name: Android SDK availability
        run: test -d "$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build Android 9 TV APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PtvPieBuild=true
      - name: Verify Android 9 manifest and TV launcher
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/tv-badging.txt
          grep -q "sdkVersion:'28'" /tmp/tv-badging.txt
          grep -q "leanback-launchable-activity:" /tmp/tv-badging.txt
          cat /tmp/tv-badging.txt | grep -E "sdkVersion|leanback-launchable-activity|native-code"
      - name: Verify APK signature, archive and checksum
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "sdkVersion:'28'"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > SHA256SUMS.txt)
          (cd "$(dirname "$APK")" && sha256sum -c SHA256SUMS.txt)
      - name: Verify artifact metadata
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-player-android-tv-pie-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
