name: AI Pulse vowel formant tests
on:
  push:
    branches: [feat/ai-pulse-studio-foundation]
  pull_request:
  workflow_dispatch:
jobs:
  vowel-formants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/ai_pulse_local/test_vowel_formants.cjs
